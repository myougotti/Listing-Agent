name: poll-listings

on:
  schedule:
    - cron: '*/30 * * * *'        # every 30 min UTC
  workflow_dispatch: {}

# Allow committing the DB back to the repo so state persists across runs.
permissions:
  contents: write

concurrency:
  group: poll-listings
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run agent
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LISTING_AGENT_DB_PATH: ${{ github.workspace }}/data/seen.db
          LISTING_AGENT_CRITERIA: ${{ github.workspace }}/criteria.yaml
        run: python -m listing_agent

      - name: Commit DB
        run: |
          git config user.name  "listing-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.db || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push || true
